# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "dimos-layer"
BBFILE_PATTERN_dimos-layer = "^${LAYERDIR}/"
BBFILE_PRIORITY_dimos-layer = "6"

LAYERDEPENDS_dimos-layer = "core openembedded-layer flutter-layer"
LAYERSERIES_COMPAT_dimos-layer = "scarthgap"
